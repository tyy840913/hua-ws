<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北京时间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.03) 0%, transparent 40%);
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(30, 30, 30, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 
                0 8px 32px 0 rgba(0, 0, 0, 0.37),
                inset 0 1px 0 0 rgba(255,255,255,0.05);
            max-width: 90%;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .container::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, rgba(255,255,255,0.1), transparent, rgba(255,255,255,0.05));
            z-index: -1;
            border-radius: 26px;
            opacity: 0.5;
        }

        .title {
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .time-display {
            font-size: 5em;
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(to right, #ffffff, #e0e0e0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(255,255,255,0.1);
            position: relative;
            display: inline-block;
        }

        .time-display::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 3s infinite;
            opacity: 0.3;
        }

        .date-display {
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #b0b0b0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .weekday-display {
            font-size: 1.3em;
            color: #909090;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .timezone-info {
            font-size: 1em;
            color: #707070;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-weight: 300;
        }

        .colon {
            animation: pulse 1.5s infinite;
            display: inline-block;
            color: #ffffff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .seconds {
            font-size: 0.6em;
            color: #a0a0a0;
            margin-left: 5px;
            font-weight: 300;
        }

        .am-pm {
            font-size: 0.5em;
            margin-left: 15px;
            color: #b0b0b0;
            font-weight: 300;
            vertical-align: super;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 1.8em;
            }
            .time-display {
                font-size: 3.5em;
            }
            .date-display {
                font-size: 1.4em;
            }
            .weekday-display {
                font-size: 1.1em;
            }
            .container {
                padding: 30px 20px;
            }
        }

        @media (max-width: 480px) {
            .time-display {
                font-size: 2.5em;
            }
            .date-display {
                font-size: 1.2em;
            }
            .title {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">北京时间</h1>
        <div class="time-display" id="time">
            <span id="hours"></span><span class="colon">:</span><span id="minutes"></span><span class="seconds" id="seconds"></span><span class="am-pm" id="ampm"></span>
        </div>
        <div class="date-display" id="date"></div>
        <div class="weekday-display" id="weekday"></div>
        <div class="timezone-info">东八区 (UTC+8)</div>
    </div>

    <script>
        function updateTime() {
            // 获取北京时间 (UTC+8)
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const beijingTime = new Date(utc + (8 * 3600000));
            
            // 格式化时间
            let hours = beijingTime.getHours();
            const minutes = beijingTime.getMinutes();
            const seconds = beijingTime.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            // 12小时制
            const displayHours = hours % 12 || 12;
            
            // 补零
            const padZero = (num) => num.toString().padStart(2, '0');
            
            // 更新显示
            document.getElementById('hours').textContent = padZero(displayHours);
            document.getElementById('minutes').textContent = padZero(minutes);
            document.getElementById('seconds').textContent = padZero(seconds);
            document.getElementById('ampm').textContent = ampm;
            
            // 格式化日期
            const year = beijingTime.getFullYear();
            const month = padZero(beijingTime.getMonth() + 1);
            const day = padZero(beijingTime.getDate());
            
            document.getElementById('date').textContent = `${year}年${month}月${day}日`;
            
            // 格式化星期
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[beijingTime.getDay()];
            document.getElementById('weekday').textContent = weekday;
        }

        // 初始化
        updateTime();
        
        // 每秒更新
        setInterval(updateTime, 1000);
        
        // 添加页面可见性变化监听，防止标签页不活动时暂停
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                updateTime();
            }
        });
    </script>
</body>
</html>
